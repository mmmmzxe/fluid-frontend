name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to Server via SCP
        uses: appleboy/scp-action@master
        with:
          host: "72.61.192.168"
          username: "root"
          password: "Mo@1234567891234"
          port: 22
          source: "dist/*"
          target: "/var/www/extrachic/frontend/"
          strip_components: 1
